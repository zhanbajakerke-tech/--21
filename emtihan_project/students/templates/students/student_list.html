<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Студенттер тізімі</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4b79a1, #283e51);
            margin: 0;
            padding: 40px;
            color: white;
        }

        h2 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 20px;
            color: #d7f4ff;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            color: #222;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        th {
            background: #4b79a1;
            color: white;
            padding: 14px;
            font-size: 18px;
        }

        td {
            padding: 12px;
            text-align: center;
            font-size: 17px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #eef7ff;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 30px;
            font-size: 20px;
            text-decoration: none;
            color: #d7f4ff;
            font-weight: bold;
        }

        a:hover {
            color: #b4e4ff;
        }
    </style>
</head>

<body>

<h2>Студенттер тізімі</h2>

<table>
    <tr>
        <th>Аты</th>
        <th>1-р емтихан</th>
        <th>2-р емтихан</th>
    </tr>

    {% for s in combined %}
    <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.exam1 }}</td>
        <td>{{ s.exam2 }}</td>
    </tr>
    {% endfor %}
</table>

<a href="{% url 'process' %}">← Артқа</a>

</body>
</html>
